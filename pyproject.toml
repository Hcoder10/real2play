[project]
name = "real2play"
version = "0.1.0"
description = "Real2Play: Gemini builds an exact twin of your robot, gamifies the task, trains the robot on play."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.2",
  "scipy>=1.14",
  "mujoco==3.13.0",
  "opencv-contrib-python==4.13.0.92",
  "pillow>=11",
  "pytest>=8",
]

[project.optional-dependencies]
robot = ["lerobot[feetech]==0.6.1"]
gemini = ["google-genai>=2.33.0"]
train = ["torch"]
vla = ["lerobot[smolvla]==0.6.1", "transformers==5.4.0", "tokenizers==0.22.2", "huggingface-hub==1.6.0", "safetensors>=0.4.3,<1"]
vla_prep = ["pip", "huggingface-hub>=1.6,<2"]

[tool.setuptools.packages.find]
include = ["r2p*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
